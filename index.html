<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Robo A.I.</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      overflow: hidden; /* Prevent scrollbars from mouse at edge */
    }

    #video,
    #canvas {
      display: none; /* Hide video and canvas */
    }

    .card {
      max-width: 48rem;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      overflow: hidden;
      margin: auto;
    }

    .card-header {
      text-align: center;
      padding: 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .card-title {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .status {
      margin-top: 0.5rem;
      font-size: 1rem;
      opacity: 0.9;
    }

    .card-content {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .eye-box {
      width: 28rem;
      height: 18rem;
      background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
      border-radius: 2rem;
      margin-bottom: 2rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 
        inset 0 2px 4px rgba(255,255,255,0.1),
        0 8px 32px rgba(0,0,0,0.3);
    }

    .eyes {
      display: flex;
      gap: 4rem;
      position: relative;
    }

    .eye-container {
      width: 7rem;
      height: 7rem;
      position: relative;
      overflow: visible;
    }

    .eye {
      width: 6rem;
      height: 6rem;
      background: linear-gradient(145deg, #4f46e5, #3b82f6);
      border-radius: 0.75rem; /* Square-ish eyes */
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); /* Faster transition for mouse */
      box-shadow: 
        0 0 20px rgba(59, 130, 246, 0.4),
        inset 0 2px 4px rgba(255,255,255,0.2);
    }

    .pupil {
      display: none; /* Keeping for future use */
    }

    /* Expression styles - keeping for future use (commented out in HTML body) */
    .eye.happy { height: 3.5rem; border-radius: 3rem 3rem 0 0; animation: happy-bounce 0.6s ease-in-out infinite; }
    @keyframes happy-bounce { 0%, 100% { transform: translate(-50%, -50%) translateY(-1rem); } 50% { transform: translate(-50%, -50%) translateY(-1.2rem); } }
    .happy-mouth { position: absolute; width: 8rem; height: 5rem; border: 0.3rem solid transparent; bottom: 25%; left: 50%; transform: translateX(-50%); box-sizing: border-box; border-radius: 50%; border-bottom-color: #fbbf24; opacity: 0; display: none; z-index: 5; filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.5)); }
    .happy-mouth.active { display: block; animation: happy-mouth-appear 0.8s ease-out forwards; }
    @keyframes happy-mouth-appear { 0% { opacity: 0; width: 3rem; height: 2rem; transform: translateX(-50%) scale(0.5); } 100% { opacity: 1; width: 8rem; height: 5rem; transform: translateX(-50%) scale(1); } }
    .eye.sad { background: linear-gradient(145deg, #1e40af, #1e3a8a); height: 3rem; border-radius: 0 0 3rem 3rem; animation: sad-droop 2s ease-out forwards; }
    @keyframes sad-droop { 0% { height: 6rem; border-radius: 0.75rem; transform: translate(-50%, -50%); } 100% { height: 3rem; border-radius: 0 0 3rem 3rem; transform: translate(-50%, -50%) translateY(2rem); } }
    .sad-mouth { position: absolute; width: 6rem; height: 6rem; border: 0.25rem solid #6b7280; bottom: 20%; left: 50%; transform: translateX(-50%); box-sizing: border-box; border-radius: 50%; border-top-color: transparent; border-left-color: transparent; border-right-color: transparent; opacity: 0; display: none; z-index: 5; }
    .sad-mouth.active { display: block; animation: sad-mouth-appear 2s ease-out forwards; }
    @keyframes sad-mouth-appear { 0% { opacity: 0; transform: translateX(-50%) scale(0.5); } 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
    
    .blink {
      height: 0.3rem !important;
      transform: translate(-50%, -50%) scaleY(0.05) !important;
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1) !important; /* Faster blink */
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin-top: 1rem;
    }

    .control-button { /* Style for future expression buttons */
      padding: 0.75rem 1.5rem; background: linear-gradient(145deg, #e5e7eb, #d1d5db); border: none; border-radius: 0.75rem; cursor: pointer; transition: all 0.3s ease; font-weight: 600; color: #374151; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .control-button:hover { transform: translateY(-2px); box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.2); background: linear-gradient(145deg, #d1d5db, #9ca3af); }
    .control-button.active { background: linear-gradient(145deg, #4f46e5, #3b82f6); color: white; transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 15px -3px rgba(79, 70, 229, 0.4); }

    .camera-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .camera-status.active { background: rgba(34, 197, 94, 0.1); color: #16a34a; }
    .camera-status.inactive { background: rgba(239, 68, 68, 0.1); color: #dc2626; }
    .status-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; animation: pulse 2s infinite; }
    .camera-status.active .status-dot { background: #16a34a; }
    .camera-status.inactive .status-dot { background: #dc2626; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Robo A.I.</div>
      <div class="status">
        <div class="camera-status inactive" id="camera-status">
          <div class="status-dot"></div>
          <span id="status-text">Initializing...</span>
        </div>
      </div>
    </div>
    <div class="card-content">
      <div class="eye-box" id="eye-box">
        <div class="eyes">
          <div class="eye-container">
            <div class="eye" id="left-eye"></div>
          </div>
          <div class="eye-container">
            <div class="eye" id="right-eye"></div>
          </div>
        </div>
        </div>
      </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const videoElement = document.getElementById('video');
    const leftEye = document.getElementById('left-eye');
    const rightEye = document.getElementById('right-eye');
    const cameraStatus = document.getElementById('camera-status');
    const statusText = document.getElementById('status-text');

    let isBlinking = false;
    let isIdleMode = false; // Eyes start active, will go idle if no mouse movement
    let idleTimer = null;
    let isExpressionActive = false; // For future use with expressions
    let expressionTimeout = null;   // For future use
    
    let faceDetected = false; // Tracks if a face is detected by camera
    let lastFaceTime = Date.now(); // Last time a face was detected

    let mouseActivityTimeout = null;
    const MOUSE_INACTIVITY_THRESHOLD = 4000; // 4 seconds for mouse to be considered inactive

    function updateCameraStatus(active, text) {
      cameraStatus.className = `camera-status ${active ? 'active' : 'inactive'}`;
      statusText.textContent = text;
    }

    function clearIdleTimer() {
      if (idleTimer) {
        clearTimeout(idleTimer);
        idleTimer = null;
      }
    }

    function moveEyesToPosition(x, y) {
      if (isExpressionActive) return;

      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      // Normalize mouse coordinates relative to a region of the screen.
      // normFactor: 0.5 means full eye range when mouse is +/- 50% from center.
      // Smaller (e.g., 0.3) = more sensitive in center. Larger = less sensitive.
      const normFactor = 0.4; 
      const relX = Math.max(-1, Math.min(1, (x - centerX) / (window.innerWidth * normFactor)));
      const relY = Math.max(-1, Math.min(1, (y - centerY) / (window.innerHeight * normFactor)));

      // eyeMovementMultiplier: How far the eyes move in 'rem' units.
      // Adjust this value for more/less pronounced movement.
      const eyeMovementMultiplier = 2.5; 
      
      const eyeX = relX * eyeMovementMultiplier;
      const eyeY = relY * eyeMovementMultiplier;
      
      leftEye.style.transform = `translate(calc(-50% + ${eyeX}rem), calc(-50% + ${eyeY}rem))`;
      rightEye.style.transform = `translate(calc(-50% + ${eyeX}rem), calc(-50% + ${eyeY}rem))`;
    }

    function resetEyes() {
      if (expressionTimeout) {
        clearTimeout(expressionTimeout);
        expressionTimeout = null;
      }
      // Reset classes if expressions were used
      leftEye.className = 'eye';
      rightEye.className = 'eye';
      // Center the eyes
      leftEye.style.transform = 'translate(-50%, -50%)';
      rightEye.style.transform = 'translate(-50%, -50%)';
      
      isExpressionActive = false;
      // Future: Reset mouth elements and expression buttons
    }

    function setupBlinking() {
      const blink = () => {
        if (isBlinking || isExpressionActive) {
          setTimeout(blink, 700 + Math.random() * 500); // Check a bit later
          return;
        }
        isBlinking = true;
        leftEye.classList.add('blink');
        rightEye.classList.add('blink');
        setTimeout(() => {
          leftEye.classList.remove('blink');
          rightEye.classList.remove('blink');
          isBlinking = false;
        }, 120); // Blink duration
        setTimeout(blink, Math.random() * 4000 + 3000); // Time until next blink
      };
      setTimeout(blink, Math.random() * 3000 + 1000); // Initial blink
    }

    function setupIdleMovement() {
      if (!isIdleMode || isExpressionActive) {
        clearIdleTimer();
        return;
      }
      
      const moveEyesRandomly = () => {
        if (isExpressionActive || !isIdleMode) { // If mouse moved or expression started
          clearIdleTimer();
          return;
        }
        
        const maxIdleOffset = 0.8; // Max movement in rem from center during idle
        const randomX = (Math.random() - 0.5) * 2 * maxIdleOffset; 
        const randomY = (Math.random() - 0.5) * 2 * maxIdleOffset;
        
        leftEye.style.transform = `translate(calc(-50% + ${randomX}rem), calc(-50% + ${randomY}rem))`;
        rightEye.style.transform = `translate(calc(-50% + ${randomX}rem), calc(-50% + ${randomY}rem))`;
        
        const nextMove = Math.random() * 2000 + 1500; 
        idleTimer = setTimeout(moveEyesRandomly, nextMove);
      };
      
      clearIdleTimer(); 
      resetEyes(); // Center eyes before starting new idle sequence
      const initialDelay = Math.random() * 1000 + 800; 
      idleTimer = setTimeout(moveEyesRandomly, initialDelay);
    }

    // Mouse tracking for eye movement
    document.addEventListener('mousemove', function(event) {
      if (isExpressionActive) return;

      moveEyesToPosition(event.clientX, event.clientY);
      
      // Mouse activity means not idle
      if (isIdleMode) {
        // resetEyes(); // Not strictly needed, moveEyesToPosition overrides
      }
      isIdleMode = false;
      clearIdleTimer(); 
      
      if (mouseActivityTimeout) {
        clearTimeout(mouseActivityTimeout);
      }
      
      mouseActivityTimeout = setTimeout(() => {
        if (!isExpressionActive) { 
          isIdleMode = true;
          setupIdleMovement();
        }
      }, MOUSE_INACTIVITY_THRESHOLD);
    });

    // Initialize MediaPipe FaceMesh (for camera status and future features)
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // This function now only updates status based on face detection, does not move eyes.
    function onFaceMeshResults(results) {
      const now = Date.now();
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        if (faceDetected) { // Only update status if it changed
            // updateCameraStatus(true, "No face detected"); // Status updated based on camera
        }
        faceDetected = false;
        // If mouse is also idle, the general status might be "Idle". 
        // Here, just report camera's direct observation.
        if (cameraStatus.textContent !== "Camera access failed" && cameraStatus.textContent !== "Camera failed. Eyes follow mouse.") {
             updateCameraStatus(true, "No face detected");
        }

      } else {
        if (!faceDetected) { // Only update status if it changed
            updateCameraStatus(true, "Face detected");
        }
        faceDetected = true;
        lastFaceTime = now;
        // Face detection does not override mouse-driven idle mode for eye movement.
        // It can be used for other interactions (e.g. expressions, active blinking)
      }
    }
    faceMesh.onResults(onFaceMeshResults);

    // Start camera feed
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    const startSystem = () => {
        setupBlinking();
        // Initial setup for mouse inactivity leading to idle mode
        isIdleMode = false; // Start as not idle
        if (mouseActivityTimeout) clearTimeout(mouseActivityTimeout);
        mouseActivityTimeout = setTimeout(() => {
            if (!isExpressionActive && !isIdleMode) { 
                isIdleMode = true;
                setupIdleMovement();
            }
        }, MOUSE_INACTIVITY_THRESHOLD);
    };
    
    camera.start().then(() => {
      updateCameraStatus(true, "Camera ready. Eyes follow mouse.");
      startSystem();
    }).catch((error) => {
      console.error('Camera access failed:', error);
      updateCameraStatus(false, "Camera failed. Eyes follow mouse.");
      startSystem(); // Still allow mouse tracking and blinking if camera fails
    });

    // Handle window resize (optional, but good practice if camera is sensitive to it)
    window.addEventListener('resize', () => {
      // For this setup, mouse tracking uses window.innerWidth/Height directly,
      // so no specific camera restart is strictly needed for eye movement.
      // If camera aspect ratio becomes an issue for FaceMesh, you might re-init.
    });

    /* Expression event listeners - keeping for future use
    document.addEventListener('click', function(e) {
      const exprBtn = e.target.closest('[data-expr]');
      if (exprBtn) {
        // setExpression(exprBtn.dataset.expr); // Define setExpression function
        return;
      }
      if (e.target.id === 'reset-btn') {
        resetEyes();
        // Restart mouse inactivity check if needed
        if (mouseActivityTimeout) clearTimeout(mouseActivityTimeout);
        mouseActivityTimeout = setTimeout(() => { ... });
      }
    });
    */
  });
  </script>
</body>
</html>
