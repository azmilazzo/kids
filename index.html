<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Robo A.I.</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    #video,
    #canvas {
      display: none; /* Hide video and canvas */
    }

    .card {
      max-width: 48rem;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      overflow: hidden;
      margin: auto;
    }

    .card-header {
      text-align: center;
      padding: 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .card-title {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .status {
      margin-top: 0.5rem;
      font-size: 1rem;
      opacity: 0.9;
    }

    .card-content {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .eye-box {
      width: 28rem;
      height: 18rem;
      background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
      border-radius: 2rem;
      margin-bottom: 2rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 
        inset 0 2px 4px rgba(255,255,255,0.1),
        0 8px 32px rgba(0,0,0,0.3);
    }

    .eyes {
      display: flex;
      gap: 4rem;
      position: relative;
    }

    .eye-container {
      width: 7rem;
      height: 7rem;
      position: relative;
      overflow: visible;
    }

    .eye {
      width: 6rem;
      height: 6rem;
      background: linear-gradient(145deg, #4f46e5, #3b82f6);
      border-radius: 0.75rem;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 0 20px rgba(59, 130, 246, 0.4),
        inset 0 2px 4px rgba(255,255,255,0.2);
    }

    .pupil {
      display: none;
      /* Keeping for future use
      width: 1.5rem;
      height: 1.5rem;
      background: radial-gradient(circle at 30% 30%, #ffffff, #1e293b);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.2s ease-out;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      */
    }

    /* Expression styles - keeping for future use
    .eye.happy {
      height: 3.5rem;
      border-radius: 3rem 3rem 0 0;
      animation: happy-bounce 0.6s ease-in-out infinite;
    }

    @keyframes happy-bounce {
      0% { transform: translate(-50%, -50%) translateY(-1rem); }
      50% { transform: translate(-50%, -50%) translateY(-1.2rem); }
      100% { transform: translate(-50%, -50%) translateY(-1rem); }
    }

    .happy-mouth {
      position: absolute;
      width: 8rem;
      height: 5rem;
      border: 0.3rem solid transparent;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      border-radius: 50%;
      border-bottom-color: #fbbf24;
      opacity: 0;
      display: none;
      z-index: 5;
      filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.5));
    }

    .happy-mouth.active {
      display: block;
      animation: happy-mouth-appear 0.8s ease-out forwards;
    }

    @keyframes happy-mouth-appear {
      0% { 
        opacity: 0;
        width: 3rem;
        height: 2rem;
        transform: translateX(-50%) scale(0.5);
      }
      100% { 
        opacity: 1;
        width: 8rem;
        height: 5rem;
        transform: translateX(-50%) scale(1);
      }
    }

    .eye.sad {
      background: linear-gradient(145deg, #1e40af, #1e3a8a);
      height: 3rem;
      border-radius: 0 0 3rem 3rem;
      animation: sad-droop 2s ease-out forwards;
    }

    @keyframes sad-droop {
      0% { 
        height: 6rem;
        border-radius: 0.75rem;
        transform: translate(-50%, -50%);
      }
      100% { 
        height: 3rem;
        border-radius: 0 0 3rem 3rem;
        transform: translate(-50%, -50%) translateY(2rem);
      }
    }

    .sad-mouth {
      position: absolute;
      width: 6rem;
      height: 6rem;
      border: 0.25rem solid #6b7280;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      border-radius: 50%;
      border-top-color: transparent;
      border-left-color: transparent;
      border-right-color: transparent;
      opacity: 0;
      display: none;
      z-index: 5;
    }

    .sad-mouth.active {
      display: block;
      animation: sad-mouth-appear 2s ease-out forwards;
    }

    @keyframes sad-mouth-appear {
      0% { 
        opacity: 0;
        transform: translateX(-50%) scale(0.5);
      }
      100% { 
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
    }
    */

    .blink {
      height: 0.3rem !important;
      transform: translate(-50%, -50%) scaleY(0.05) !important;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin-top: 1rem;
    }

    .control-button {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(145deg, #e5e7eb, #d1d5db);
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      color: #374151;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .control-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.2);
      background: linear-gradient(145deg, #d1d5db, #9ca3af);
    }

    .control-button.active {
      background: linear-gradient(145deg, #4f46e5, #3b82f6);
      color: white;
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 15px -3px rgba(79, 70, 229, 0.4);
    }

    .camera-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .camera-status.active {
      background: rgba(34, 197, 94, 0.1);
      color: #16a34a;
    }

    .camera-status.inactive {
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
    }

    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .camera-status.active .status-dot {
      background: #16a34a;
    }

    .camera-status.inactive .status-dot {
      background: #dc2626;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <!-- Hidden camera elements -->
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Robo A.I.</div>
      <div class="status">
        <div class="camera-status inactive" id="camera-status">
          <div class="status-dot"></div>
          <span id="status-text">Initializing camera...</span>
        </div>
      </div>
    </div>
    <div class="card-content">
      <div class="eye-box" id="eye-box">
        <div class="eyes">
          <div class="eye-container">
            <div class="eye" id="left-eye">
              <!-- <div class="pupil" id="left-pupil"></div> keeping for future use -->
            </div>
          </div>
          <div class="eye-container">
            <div class="eye" id="right-eye">
              <!-- <div class="pupil" id="right-pupil"></div> keeping for future use -->
            </div>
          </div>
        </div>
        <!-- Expression elements - keeping for future use
        <div class="sad-mouth" id="sad-mouth"></div>
        <div class="happy-mouth" id="happy-mouth"></div>
        -->
      </div>
      <!-- Expression controls - keeping for future use
      <div class="controls">
        <button class="control-button" data-expr="happy">😄 Happy</button>
        <button class="control-button" data-expr="sad">😢 Sad</button>
        <button class="control-button" id="reset-btn">🔄 Reset</button>
      </div>
      -->
    </div>
  </div>

  <!-- Load dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const videoElement = document.getElementById('video');
      const leftEye = document.getElementById('left-eye');
      const rightEye = document.getElementById('right-eye');
      // const leftPupil = document.getElementById('left-pupil'); // keeping for future use
      // const rightPupil = document.getElementById('right-pupil'); // keeping for future use
      const cameraStatus = document.getElementById('camera-status');
      const statusText = document.getElementById('status-text');
      // Expression elements - keeping for future use
      // const sadMouth = document.getElementById('sad-mouth');
      // const happyMouth = document.getElementById('happy-mouth');
      // const resetBtn = document.getElementById('reset-btn');

      let isBlinking = false;
      let isIdleMode = true;
      let idleTimer = null;
      let isExpressionActive = false;
      let expressionTimeout = null;
      let faceDetected = false;
      let lastFaceTime = Date.now();

      // Eye movement constraints
      const PUPIL_RANGE = 1.5; // How far pupils can move from center

      function updateCameraStatus(active, text) {
        cameraStatus.className = `camera-status ${active ? 'active' : 'inactive'}`;
        statusText.textContent = text;
      }

      function clearIdleTimer() {
        if (idleTimer) {
          clearTimeout(idleTimer);
          idleTimer = null;
        }
      }

      function moveEyesToPosition(x, y) {
        if (isExpressionActive) return;

        // Normalize coordinates to screen space
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        
        // Calculate relative position (-1 to 1)
        const relX = Math.max(-1, Math.min(1, (x - centerX) / (window.innerWidth * 0.3)));
        const relY = Math.max(-1, Math.min(1, (y - centerY) / (window.innerHeight * 0.3)));

        /* Pupil movement - keeping for future use
        // Move pupils within their range
        const pupilX = relX * PUPIL_RANGE;
        const pupilY = relY * PUPIL_RANGE;

        leftPupil.style.transform = `translate(calc(-50% + ${pupilX}rem), calc(-50% + ${pupilY}rem))`;
        rightPupil.style.transform = `translate(calc(-50% + ${pupilX}rem), calc(-50% + ${pupilY}rem))`;
        */
 function moveEyesToPosition(x, y) {
        if (isExpressionActive) return;

        // Normalize coordinates to screen space
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        
        // Calculate relative position (-1 to 1)
        // You can make the divisor smaller (e.g., window.innerWidth * 0.2) 
        // to make the eyes react more to smaller nose movements.
        const relX = Math.max(-1, Math.min(1, (x - centerX) / (window.innerWidth * 0.25))); // ছিল 0.3
        const relY = Math.max(-1, Math.min(1, (y - centerY) / (window.innerHeight * 0.25))); // ছিল 0.3

        // Move entire eyes for tracking effect
        // Increase the multiplier (e.g., 2.0 or 2.5) to make the eyes move further.
        const eyeX = relX * 2.0; // ছিল 1.2
        const eyeY = relY * 2.0; // ছিল 1.2
        
        leftEye.style.transform = `translate(calc(-50% + ${eyeX}rem), calc(-50% + ${eyeY}rem))`;
        rightEye.style.transform = `translate(calc(-50% + ${eyeX}rem), calc(-50% + ${eyeY}rem))`;
      }
      function resetEyes() {
        if (expressionTimeout) {
          clearTimeout(expressionTimeout);
          expressionTimeout = null;
        }
        leftEye.className = 'eye';
        rightEye.className = 'eye';
        leftEye.style.transform = 'translate(-50%, -50%)';
        rightEye.style.transform = 'translate(-50%, -50%)';
        // leftPupil.style.transform = 'translate(-50%, -50%)'; // keeping for future use
        // rightPupil.style.transform = 'translate(-50%, -50%)'; // keeping for future use
        
        /* Expression reset - keeping for future use
        sadMouth.style.display = 'none';
        sadMouth.classList.remove('active');
        happyMouth.style.display = 'none';
        happyMouth.classList.remove('active');
        */
        
        isExpressionActive = false;
        
        /* Button state reset - keeping for future use
        // Clear active states
        document.querySelectorAll('[data-expr]').forEach(btn => {
          btn.classList.remove('active');
        });
        */
      }

      function setupBlinking() {
        const blink = () => {
          if (isBlinking || isExpressionActive) {
            setTimeout(blink, 500);
            return;
          }
          isBlinking = true;
          leftEye.classList.add('blink');
          rightEye.classList.add('blink');
          setTimeout(() => {
            leftEye.classList.remove('blink');
            rightEye.classList.remove('blink');
            isBlinking = false;
          }, 150);
          setTimeout(blink, Math.random() * 3000 + 2000);
        };
        setTimeout(blink, Math.random() * 2000 + 1000);
      }

      function setupIdleMovement() {
        if (!isIdleMode || isExpressionActive) {
          clearIdleTimer();
          return;
        }
        
        const moveEyes = () => {
          if (isExpressionActive || faceDetected) {
            idleTimer = setTimeout(moveEyes, 1000);
            return;
          }
          
          // Random eye movement
          const x = (Math.random() - 0.5) * window.innerWidth;
          const y = (Math.random() - 0.5) * window.innerHeight;
          moveEyesToPosition(window.innerWidth/2 + x, window.innerHeight/2 + y);
          
          const nextMove = Math.random() * 2000 + 1500;
          idleTimer = setTimeout(moveEyes, nextMove);
        };
        
        const initialDelay = Math.random() * 1500 + 1000;
        idleTimer = setTimeout(moveEyes, initialDelay);
      }

      /* Expression function - keeping for future use
      function setExpression(expression) {
        resetEyes();
        isExpressionActive = true;
        clearIdleTimer();

        // Set active state on button
        document.querySelectorAll('[data-expr]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.expr === expression);
        });

        if (expression === 'sad') {
          leftEye.className = 'eye sad';
          rightEye.className = 'eye sad';
          sadMouth.style.display = 'block';
          sadMouth.classList.add('active');
        } else if (expression === 'happy') {
          leftEye.className = 'eye happy';
          rightEye.className = 'eye happy';
          happyMouth.style.display = 'block';
          happyMouth.classList.add('active');
        }

        expressionTimeout = setTimeout(() => {
          resetEyes();
          setupIdleMovement();
        }, 5000);
      }
      */

      // Initialize MediaPipe FaceMesh
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onResults);

      function onResults(results) {
        const now = Date.now();
        
        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
          faceDetected = false;
          // If no face detected for 2 seconds, enable idle mode
          if (now - lastFaceTime > 2000 && !isIdleMode) {
            isIdleMode = true;
            updateCameraStatus(true, "Face tracking - Idle mode");
            setupIdleMovement();
          }
          return;
        }

        faceDetected = true;
        lastFaceTime = now;
        isIdleMode = false;
        clearIdleTimer();
        updateCameraStatus(true, "Face tracking - Active");

        const landmarks = results.multiFaceLandmarks[0];
        const noseTip = landmarks[4]; // Nose tip landmark

        if (noseTip) {
          // Mirror x-coordinate for natural interaction
          const mirroredNoseX = 1 - noseTip.x;
          const noseY = noseTip.y;

          // Convert to screen coordinates
          const screenX = mirroredNoseX * window.innerWidth;
          const screenY = noseY * window.innerHeight;

          moveEyesToPosition(screenX, screenY);
        }
      }

      // Start camera feed
      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });

      camera.start().then(() => {
        updateCameraStatus(true, "Camera ready - Look around!");
        setupBlinking();
        setupIdleMovement();
      }).catch((error) => {
        console.error('Camera access failed:', error);
        updateCameraStatus(false, "Camera access failed");
        isIdleMode = true;
        setupBlinking();
        setupIdleMovement();
      });

      /* Event listeners for expressions - keeping for future use
      // Event listeners
      document.addEventListener('click', function(e) {
        const exprBtn = e.target.closest('[data-expr]');
        if (exprBtn) {
          setExpression(exprBtn.dataset.expr);
          return;
        }
        
        if (e.target === resetBtn) {
          resetEyes();
          setupIdleMovement();
        }
      });
      */

      // Handle window resize
      window.addEventListener('resize', () => {
        if (camera) {
          camera.stop();
          setTimeout(() => {
            camera.start();
          }, 100);
        }
      });

      // Check for face detection timeout periodically
      setInterval(() => {
        const now = Date.now();
        if (faceDetected && now - lastFaceTime > 3000) {
          faceDetected = false;
          isIdleMode = true;
          updateCameraStatus(true, "Face tracking - Idle mode");
          setupIdleMovement();
        }
      }, 1000);
    });
  </script>
</body>
</html>
